name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: music
          POSTGRES_PASSWORD: music
          POSTGRES_DB: music
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U music" --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://music:music@localhost:5432/music
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Alembic upgrade on PostgreSQL
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Downgrade and upgrade again
        run: uv run alembic downgrade base && uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --python 3.12
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Protocol types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- frontend/src/shared/protocol/
      - name: Generate FakeProvider audio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 scripts/gen_fake_audio.py
      - name: Playwright
        run: npx playwright test
        working-directory: frontend
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate FakeProvider audio (demo stack without Yandex account)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 scripts/gen_fake_audio.py
      - name: Prepare .env
        run: |
          grep -vE '^(ENV|DOMAIN|PUBLIC_ORIGIN|MUSIC_PROVIDER|POSTGRES_PASSWORD|SESSION_SECRET)=' .env.example > .env
          {
            echo "ENV=prod"
            echo "DOMAIN=localhost"
            echo "PUBLIC_ORIGIN=https://localhost"
            echo "MUSIC_PROVIDER=fake"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
          } >> .env
      - name: docker compose up -d
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test over HTTPS (incl. restart)
        run: SMOKE_RESTART=1 bash scripts/smoke.sh https://localhost
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
