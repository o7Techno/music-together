# Локальная разработка: только PostgreSQL. Бэкенд и фронт запускаются нативно с hot reload (`npm run dev`).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata-dev:
