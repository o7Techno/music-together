# Продакшен: `docker compose up -d` поднимает Postgres, бэкенд (миграции при старте) и Caddy
# (статика фронта + HTTPS). Конфигурация — в `.env` (см. `.env.example`).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: music
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: ${ENV:-prod}
      LOG_JSON: "true"
      DATABASE_URL: postgresql+asyncpg://music:${POSTGRES_PASSWORD}@db:5432/music
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
    depends_on:
      db:
        condition: service_healthy
    # Время на сохранение комнат и закрытие WebSocket при остановке.
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
